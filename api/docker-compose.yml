services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: inventario
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
