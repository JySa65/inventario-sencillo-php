[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = { version = "1.37.2", features = ["serde", "serde-with-str"] }

# Web + async
axum = { version = "0.8.4", features = ["macros", "json"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"] }

# DB (Postgres) + dotenv
sqlx = { version = "0.8.6", features = [
  "runtime-tokio", "postgres", "chrono", "uuid", "macros", "rust_decimal",
] }
# sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
dotenvy = "0.15.7"

# Utilidades
validator = { version = "0.20.0", features = ["derive"] }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
uuid = { version = "1.18.0", features = ["v4", "serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
anyhow = "1.0.99"
thiserror = "2.0.16"

# Auth
jsonwebtoken = "9.3.1"

# Observabilidad
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }

# OpenAPI
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
async-trait = "0.1.89"


[lib]
name = "inventario_api"
path = "src/lib.rs"
